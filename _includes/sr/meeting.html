                        <script>
                        // Calendly loads only when the visitor asks for the scheduler (no third-party request on page load; see the Privacy Policy).
                        document.addEventListener('click', function (e) {
                            var link = e.target.closest('[data-calendly]');
                            if (!link) return;
                            e.preventDefault();
                            var url = link.getAttribute('data-calendly');
                            function open() { window.Calendly.initPopupWidget({ url: url }); }
                            if (window.Calendly) return open();
                            var css = document.createElement('link');
                            css.rel = 'stylesheet';
                            css.href = 'https://assets.calendly.com/assets/external/widget.css';
                            document.head.appendChild(css);
                            var js = document.createElement('script');
                            js.src = 'https://assets.calendly.com/assets/external/widget.js';
                            js.onload = open;
                            js.onerror = function () { window.location.href = link.href; };
                            document.head.appendChild(js);
                        });
