{% include lang.html %}
<div class="nv-cookie" id="nv-cookie" role="region" aria-label="{{ t.cookie_region }}" hidden>
    <div class="container nv-cookie__inner">
        <p class="nv-cookie__text"><strong>{{ t.cookie_title }}</strong> {{ t.cookie_text }} <a href="{{ t.privacy_url | relative_url }}">{{ t.privacy_policy }}</a>.</p>
        <div class="nv-cookie__actions">
            <button type="button" class="nv-cookie__btn nv-cookie__btn--ghost" data-consent="denied">{{ t.cookie_reject }}</button>
            <button type="button" class="nv-cookie__btn" data-consent="granted">{{ t.cookie_accept }}</button>
        </div>
    </div>
</div>
<script>
(function () {
    var banner = document.getElementById('nv-cookie');
    if (!banner || !window.nvConsent) return;
    if (!window.nvConsent.get()) banner.hidden = false;
    banner.addEventListener('click', function (e) {
        var button = e.target.closest('[data-consent]');
        if (!button) return;
        window.nvConsent.set(button.getAttribute('data-consent'));
        banner.hidden = true;
    });
    document.addEventListener('click', function (e) {
        if (!e.target.closest('[data-cookie-settings]')) return;
        e.preventDefault();
        banner.hidden = false;
        banner.querySelector('button').focus();
    });
})();
</script>
