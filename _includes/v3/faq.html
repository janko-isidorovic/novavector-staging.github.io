{% include lang.html %}
<section class="v3-section v3-section--muted">
  <div class="v3-shell v3-faq">
    <p class="v3-eyebrow">{{ page.faq_eyebrow | default: t.faq_eyebrow }}</p>
    <h2>{{ page.faq_heading | default: t.faq_heading }}</h2>
    {% for item in page.faq %}
    <details>
      <summary>{{ item.question }}</summary>
      <p>{{ item.answer }}</p>
    </details>
    {% endfor %}
  </div>
</section>
